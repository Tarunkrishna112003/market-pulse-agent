name: Supervised stock prediction agent
description: Process top 25 prices and company news locally on the GitHub runner
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache financial news model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: financial-distilroberta-v1
    - name: Gather company news from free RSS sources
      shell: bash
      run: node scripts/prediction-agent.mjs --prepare
    - name: Install CPU sentiment dependencies
      shell: bash
      continue-on-error: true
      run: |
        python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
        python -m pip install 'transformers>=4.44,<5' 'scikit-learn>=1.5,<2' joblib
    - name: Analyse financial headline sentiment
      shell: bash
      run: python scripts/news-sentiment.py public-site/prediction-news.json public-site/prediction-sentiment.json
    - name: Gather historical prices and news for supervised training
      shell: bash
      run: node scripts/prediction-agent.mjs --training-data
    - name: Test leakage controls and train candidate forecasting models
      shell: bash
      env:
        OMP_NUM_THREADS: '2'
        OPENBLAS_NUM_THREADS: '2'
      run: |
        python -m unittest discover -s scripts -p 'ml_prediction_test.py'
        python scripts/ml-prediction.py public-site/prediction-training.json public-site/prediction-sentiment.json public-site/prediction-trained.json
    - name: Save fitted models and training diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: prediction-models-${{ github.run_id }}
        path: prediction-models/
        if-no-files-found: warn
        retention-days: 1
    - name: Produce predictions and evaluate saved forecasts
      shell: bash
      run: node scripts/prediction-agent.mjs --finalize
    - name: Keep published output limited to forecasts and validation
      shell: bash
      run: |
        node --input-type=module -e "import {unlink} from 'node:fs/promises'; for(const f of ['prediction-news.json','prediction-sentiment.json','prediction-training.json','prediction-trained.json']) await unlink('public-site/'+f).catch(()=>{});"
