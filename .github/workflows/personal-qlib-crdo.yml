name: Personal Qlib CRDO test
on:
  push:
    branches: [personal-test]
    paths:
      - scripts/personal_qlib_crdo.py
      - scripts/personal_qlib_crdo_test.py
      - .github/workflows/personal-qlib-crdo.yml
permissions:
  contents: read
concurrency:
  group: personal-qlib-crdo
  cancel-in-progress: false
jobs:
  test:
    if: github.ref_name == 'personal-test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MLFLOW_ALLOW_FILE_STORE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qlib and CRDO data dependencies
        run: python -m pip install 'pyqlib==0.9.7' 'lightgbm==4.6.0' 'numpy==1.26.4' 'pandas==2.2.3' 'yfinance==0.2.66'
      - name: Install CPU backpropagation dependency
        run: python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Check feature timing and held-out splits
        run: python -m unittest discover -s scripts -p personal_qlib_crdo_test.py
      - name: Train Qlib and display 30-session CRDO results
        run: python scripts/personal_qlib_crdo.py
