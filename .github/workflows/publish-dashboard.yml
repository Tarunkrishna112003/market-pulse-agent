name: Publish dashboard design
on:
  schedule:
    # Morning snapshots in both Pacific offsets, and an after-close comparison.
    - cron: '5,40 12-14 * * 1-5'
    - cron: '55 21 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'lib/testing-results.mjs'
      - 'scripts/testing-results.mjs'
      - 'lib/daily-report.mjs'
      - 'scripts/daily-report.mjs'
      - 'lib/filters.mjs'
      - 'lib/csv-report.mjs'
      - 'lib/stock-history.mjs'
      - 'lib/prediction.mjs'
      - 'lib/prediction-news.mjs'
      - 'lib/supervised-data.mjs'
      - 'scripts/ml-prediction.py'
      - 'scripts/forecast_models.py'
      - 'scripts/forecast_benchmark.py'
      - 'scripts/forecast_runtime.py'
      - 'scripts/forecast_features.py'
      - 'scripts/forecast_research.py'
      - 'lib/frozen-forecast-migration.mjs'
      - 'data/frozen-forecasts/**'
      - 'scripts/ml_prediction_test.py'
      - 'lib/trading-calendar.mjs'
      - 'scripts/prediction-agent.mjs'
      - 'scripts/news-sentiment.py'
      - '.github/actions/prediction-agent/**'
      - 'lib/stock-news.mjs'
      - 'scripts/refresh-news.mjs'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-scan
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public dashboard
        run: node --test scripts/testing-results.test.mjs scripts/daily-report.test.mjs scripts/full-prediction.test.mjs scripts/supervised-data.test.mjs scripts/prediction.test.mjs scripts/public-dashboard.test.mjs scripts/stock-history.test.mjs scripts/price-news.test.mjs
      - name: Keep latest published report and update dashboard assets
        run: |
          mkdir -p public-site
          for file in data.json top-25.csv all-matching-stocks.csv all-screened-stocks.csv; do
            curl --fail --retry 3 --silent --show-error "https://tarunkrishna112003.github.io/market-pulse-agent/$file?deploy=${GITHUB_RUN_ID}" --output "public-site/$file"
          done
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('public-site/data.json','utf8')); if(!d.report || !Array.isArray(d.stocks)) throw Error('Invalid published scan');"
          cp github-pages/index.html github-pages/app.js github-pages/style.css github-pages/stock.html github-pages/stock.js github-pages/testing.html github-pages/testing.js public-site/
          cp lib/filters.mjs lib/csv-report.mjs lib/stock-history.mjs lib/trading-calendar.mjs public-site/
          touch public-site/.nojekyll
          node --check public-site/app.js
      - name: Refresh general Yahoo news while preserving stock report
        run: node scripts/refresh-news.mjs public-site/data.json
      - name: Decide whether forecasting code needs retraining
        id: forecast_changes
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git diff --name-only HEAD^ HEAD > /tmp/forecast-changed-files.txt
          refresh="$FORCE_REFRESH"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
          while IFS= read -r changed_file; do
            case "$changed_file" in
              scripts/ml-prediction.py|scripts/forecast_models.py|scripts/forecast_benchmark.py|scripts/forecast_runtime.py|scripts/forecast_features.py|scripts/forecast_research.py|scripts/prediction-agent.mjs|scripts/news-sentiment.py|lib/prediction.mjs|lib/prediction-news.mjs|lib/supervised-data.mjs|lib/trading-calendar.mjs|.github/actions/prediction-agent/*) refresh=true ;;
            esac
          done < /tmp/forecast-changed-files.txt
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
      - name: Preserve saved forecasts for display-only updates
        if: steps.forecast_changes.outputs.refresh == 'false'
        run: |
          for file in predictions.json prediction-history.json; do
            curl --fail --retry 3 --silent --show-error "https://tarunkrishna112003.github.io/market-pulse-agent/$file?deploy=${GITHUB_RUN_ID}" --output "public-site/$file"
          done
          node --input-type=module -e "import {readFile,writeFile,mkdir} from 'node:fs/promises'; const p=JSON.parse(await readFile('public-site/predictions.json','utf8')); const windows=p.tableFiles||[]; await mkdir('public-site/predictions',{recursive:true}); let index=0; await Promise.all(Array.from({length:4},async()=>{while(index<windows.length){const days=windows[index++];if(!Number.isInteger(days)||days<1||days>365)throw Error('Invalid forecast history');const r=await fetch('https://tarunkrishna112003.github.io/market-pulse-agent/predictions/'+days+'.json?deploy='+process.env.GITHUB_RUN_ID);if(!r.ok)throw Error('Cannot restore '+days+'-day forecasts');await writeFile('public-site/predictions/'+days+'.json',await r.text());}}));"
      - name: Train and compare next-session prediction models
        if: steps.forecast_changes.outputs.refresh == 'true'
        uses: ./.github/actions/prediction-agent
      - name: Prepare or preserve daily closing report
        run: node scripts/daily-report.mjs
      - name: Update next-week testing results
        run: node scripts/testing-results.mjs
      - name: Archive daily prediction report
        uses: actions/upload-artifact@v4
        with:
          name: daily-closing-prediction-report-${{ github.run_id }}
          path: daily-reports/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
