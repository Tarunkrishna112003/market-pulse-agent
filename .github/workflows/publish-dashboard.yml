name: Publish dashboard design
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'lib/filters.mjs'
      - 'lib/csv-report.mjs'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-scan
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep latest published report and update dashboard assets
        run: |
          mkdir -p public-site
          for file in data.json top-25.csv all-matching-stocks.csv all-screened-stocks.csv; do
            curl --fail --retry 3 --silent --show-error "https://tarunkrishna112003.github.io/market-pulse-agent/$file?deploy=${GITHUB_RUN_ID}" --output "public-site/$file"
          done
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('public-site/data.json','utf8')); if(!d.report || !Array.isArray(d.stocks)) throw Error('Invalid published scan');"
          cp github-pages/index.html github-pages/app.js github-pages/style.css public-site/
          cp lib/filters.mjs lib/csv-report.mjs public-site/
          touch public-site/.nojekyll
          node --check public-site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
