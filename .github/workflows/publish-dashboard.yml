name: Publish dashboard design
on:
  schedule:
    # Morning snapshots in both Pacific offsets, and an after-close comparison.
    - cron: '5,40 12-14 * * 1-5'
    - cron: '55 21 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'lib/testing-results.mjs'
      - 'scripts/testing-results.mjs'
      - 'lib/daily-report.mjs'
      - 'scripts/daily-report.mjs'
      - 'lib/filters.mjs'
      - 'lib/csv-report.mjs'
      - 'lib/stock-history.mjs'
      - 'lib/prediction.mjs'
      - 'lib/prediction-news.mjs'
      - 'lib/supervised-data.mjs'
      - 'scripts/ml-prediction.py'
      - 'scripts/forecast_models.py'
      - 'scripts/forecast_benchmark.py'
      - 'scripts/forecast_runtime.py'
      - 'scripts/stock_specific.py'
      - 'scripts/stock_specific_runtime.py'
      - 'lib/stock-specific-data.mjs'
      - 'data/prediction-model.json'
      - 'scripts/forecast_features.py'
      - 'scripts/forecast_research.py'
      - 'lib/frozen-forecast-migration.mjs'
      - 'data/frozen-forecasts/**'
      - 'scripts/ml_prediction_test.py'
      - 'lib/trading-calendar.mjs'
      - 'scripts/prediction-agent.mjs'
      - 'lib/published-forecasts.mjs'
      - 'scripts/archive-published-forecasts.mjs'
      - 'scripts/news-sentiment.py'
      - '.github/actions/prediction-agent/**'
      - 'lib/stock-news.mjs'
      - 'scripts/refresh-news.mjs'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:
    inputs:
      restore_november_18:
        description: Restore pre-rollout forecast data from the November 18 deployment
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-scan
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public dashboard
        run: node --test scripts/testing-results.test.mjs scripts/daily-report.test.mjs scripts/full-prediction.test.mjs scripts/supervised-data.test.mjs scripts/prediction.test.mjs scripts/public-dashboard.test.mjs scripts/stock-history.test.mjs scripts/price-news.test.mjs
      - name: Keep latest published report and update dashboard assets
        run: |
          mkdir -p public-site
          for file in data.json top-25.csv all-matching-stocks.csv all-screened-stocks.csv; do
            curl --fail --retry 3 --silent --show-error "https://tarunkrishna112003.github.io/market-pulse-agent/$file?deploy=${GITHUB_RUN_ID}" --output "public-site/$file"
          done
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('public-site/data.json','utf8')); if(!d.report || !Array.isArray(d.stocks)) throw Error('Invalid published scan');"
          cp github-pages/index.html github-pages/app.js github-pages/style.css github-pages/dashboard-data.mjs github-pages/dashboard-chart.mjs github-pages/exchange.mjs github-pages/stock.html github-pages/stock.js github-pages/testing.html github-pages/testing.js public-site/
          cp lib/filters.mjs lib/csv-report.mjs lib/stock-history.mjs lib/trading-calendar.mjs public-site/
          touch public-site/.nojekyll
          node --check public-site/app.js
      - name: Refresh general Yahoo news while preserving stock report
        run: node scripts/refresh-news.mjs public-site/data.json
      - name: Download November 18 forecast backup
        if: inputs.restore_november_18
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: '44399435428'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/november-18-artifact
      - name: Restore November 18 forecast data
        if: inputs.restore_november_18
        run: |
          backup="$RUNNER_TEMP/november-18-backup"
          mkdir -p "$backup" public-site/predictions
          tar -xf "$RUNNER_TEMP/november-18-artifact/artifact.tar" -C "$backup"
          cp "$backup/predictions.json" "$backup/prediction-history.json" "$backup/testing-results.json" public-site/
          cp "$backup/predictions/365.json" public-site/predictions/
      - name: Restore eligible saved forecasts
        if: '!inputs.restore_november_18'
        run: node scripts/restore-preopen-forecasts.mjs
      - name: Preserve every stock's published forecast in history
        if: '!inputs.restore_november_18'
        run: node scripts/archive-published-forecasts.mjs public-site
      - name: Prepare or preserve daily closing report
        run: node scripts/daily-report.mjs
      - name: Update next-week testing results
        if: '!inputs.restore_november_18'
        run: node scripts/testing-results.mjs
      - name: Archive daily prediction report
        uses: actions/upload-artifact@v4
        with:
          name: daily-closing-prediction-report-${{ github.run_id }}
          path: daily-reports/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
