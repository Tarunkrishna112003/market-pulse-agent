name: Publish dashboard design
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'lib/filters.mjs'
      - 'lib/csv-report.mjs'
      - 'lib/stock-history.mjs'
      - 'lib/prediction.mjs'
      - 'lib/prediction-news.mjs'
      - 'lib/supervised-data.mjs'
      - 'scripts/ml-prediction.py'
      - 'scripts/forecast_models.py'
      - 'scripts/ml_prediction_test.py'
      - 'lib/trading-calendar.mjs'
      - 'scripts/prediction-agent.mjs'
      - 'scripts/news-sentiment.py'
      - '.github/actions/prediction-agent/**'
      - 'lib/stock-news.mjs'
      - 'scripts/refresh-news.mjs'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-scan
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public dashboard
        run: node --test scripts/supervised-data.test.mjs scripts/prediction.test.mjs scripts/public-dashboard.test.mjs scripts/stock-history.test.mjs scripts/price-news.test.mjs
      - name: Keep latest published report and update dashboard assets
        run: |
          mkdir -p public-site
          for file in data.json top-25.csv all-matching-stocks.csv all-screened-stocks.csv; do
            curl --fail --retry 3 --silent --show-error "https://tarunkrishna112003.github.io/market-pulse-agent/$file?deploy=${GITHUB_RUN_ID}" --output "public-site/$file"
          done
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('public-site/data.json','utf8')); if(!d.report || !Array.isArray(d.stocks)) throw Error('Invalid published scan');"
          cp github-pages/index.html github-pages/app.js github-pages/style.css github-pages/stock.html github-pages/stock.js public-site/
          cp lib/filters.mjs lib/csv-report.mjs lib/stock-history.mjs lib/trading-calendar.mjs public-site/
          touch public-site/.nojekyll
          node --check public-site/app.js
      - name: Refresh general Yahoo news while preserving stock report
        run: node scripts/refresh-news.mjs public-site/data.json
      - name: Decide whether forecasting code needs retraining
        id: forecast_changes
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_REFRESH" = true ] || git diff --name-only HEAD^ HEAD | rg -q '^(scripts/(ml-prediction\.py|forecast_models\.py|prediction-agent\.mjs|news-sentiment\.py)|lib/(prediction\.mjs|prediction-news\.mjs|supervised-data\.mjs|trading-calendar\.mjs)|\.github/actions/prediction-agent/)'; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
          else
            echo 'refresh=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve saved forecasts for display-only updates
        if: steps.forecast_changes.outputs.refresh == 'false'
        run: |
          for file in predictions.json prediction-history.json; do
            curl --fail --retry 3 --silent --show-error "https://tarunkrishna112003.github.io/market-pulse-agent/$file?deploy=${GITHUB_RUN_ID}" --output "public-site/$file"
          done
      - name: Train and compare next-session prediction models
        if: steps.forecast_changes.outputs.refresh == 'true'
        uses: ./.github/actions/prediction-agent
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
