name: Daily predictions off day
on:
  schedule:
    # 05:03 Pacific in either offset, with a retry and a closing-price pass.
    - cron: '3,23 12,13 * * 1-5'
    - cron: '33 20,21 * * 1-5'
  workflow_dispatch:
    inputs:
      initialize:
        description: Initialize the future-only archive and stock directory
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: offday-prediction-archive
  cancel-in-progress: false
jobs:
  forecast:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install forecasting dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy>=1.13,<2' 'scikit-learn==1.6.1' 'lightgbm==4.6.0' 'joblib>=1.3,<2'
      - name: Verify archive and cutoff behavior
        run: python -m unittest discover -s scripts -p offday_predictions_test.py
      - name: Collect the stock universe and cutoff-safe inputs
        env:
          INITIALIZE: ${{ inputs.initialize && 'true' || 'false' }}
        run: |
          if [ "$INITIALIZE" = true ]; then
            node scripts/prepare-offday.mjs --initialize
          else
            node scripts/prepare-offday.mjs
          fi
      - name: Train the off-day model and persist forecasts and actuals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/offday_predictions.py
