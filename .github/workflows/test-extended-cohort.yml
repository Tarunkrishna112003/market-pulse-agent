name: Test original cohort with premarket and postmarket
on:
  workflow_dispatch:
  push:
    branches: [personal-test]
    paths:
      - scripts/extended_hours.py
      - scripts/extended_hours_test.py
      - scripts/test_extended_cohort.py
      - .github/workflows/test-extended-cohort.yml
permissions:
  contents: read
concurrency:
  group: extended-cohort-test
  cancel-in-progress: false
jobs:
  test:
    if: github.ref_name == 'personal-test'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded dependencies
        run: python -m pip install 'numpy==1.26.4' 'pandas==2.2.3' 'scipy>=1.13,<2' 'scikit-learn==1.6.1' 'lightgbm==4.6.0' 'joblib>=1.3,<2' 'yfinance==0.2.66'
      - name: Check as-of timing and cutoff isolation
        run: python -m unittest discover -s scripts -p extended_hours_test.py
      - name: Collect extended hours and test original cohort for 30 completed sessions
        run: python scripts/test_extended_cohort.py
