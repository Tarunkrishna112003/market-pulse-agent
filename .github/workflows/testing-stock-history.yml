name: Testing server stock history archive
on:
  push:
    branches: [testing-server]
    paths:
      - '.github/workflows/testing-stock-history.yml'
      - 'lib/history-archive.mjs'
      - 'lib/archive-retry.mjs'
      - 'scripts/archive-stock-history.mjs'
      - 'scripts/history-archive.test.mjs'
      - 'scripts/testing_server_training.py'
      - 'scripts/testing_server_training_test.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Backfill all available daily history, or append new 30-minute/completed daily bars
        type: choice
        options: [backfill, update]
        default: backfill
      train:
        description: Continue the experimental model if new completed daily labels exist
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: testing-server-history
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref_name == 'testing-server'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test append-only archive and market calendar
        run: node --test scripts/history-archive.test.mjs
      - name: Create or resume the GitHub-hosted history archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/archive-stock-history.mjs --mode prepare
  archive:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive provider-available stock history on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_MODE: ${{ inputs.mode || 'auto' }}
          ARCHIVE_SHARD: ${{ matrix.shard }}
        run: node scripts/archive-stock-history.mjs --mode "$ARCHIVE_MODE" --shard "$ARCHIVE_SHARD"
      - name: Report coverage and unresolved tickers
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHARD: ${{ matrix.shard }}
        run: node scripts/archive-stock-history.mjs --mode summary --shard "$ARCHIVE_SHARD"

  train:
    needs: [prepare, archive]
    if: always() && needs.prepare.result == 'success' && needs.archive.result != 'cancelled' && (github.event_name == 'push' || inputs.train)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU training dependencies
        run: python -m pip install 'numpy==1.26.4' 'scipy==1.13.1' 'lightgbm==4.6.0'
      - name: Test checkpoint continuation and temporal validation
        run: python -m unittest discover -s scripts -p testing_server_training_test.py
      - name: Continue the testing model from GitHub archives and saved weights
        run: python scripts/testing_server_training.py
