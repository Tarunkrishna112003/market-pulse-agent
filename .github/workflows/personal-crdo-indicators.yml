name: Personal CRDO indicators 20 sessions
on:
  workflow_dispatch:
  push:
    branches: [personal-test]
    paths:
      - scripts/personal_crdo_indicators.py
      - scripts/personal_crdo_indicators_test.py
      - .github/workflows/personal-crdo-indicators.yml
permissions:
  contents: read
jobs:
  test:
    if: github.ref_name == 'personal-test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SEC_USER_AGENT: 'MarketPulsePersonalResearch/1.0 tdodda@asu.edu'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'lightgbm==4.6.0' 'scikit-learn==1.6.1' 'numpy==1.26.4' 'pandas==2.2.3' 'yfinance==0.2.66' 'beautifulsoup4==4.13.4'
      - name: Verify indicator timing
        run: python -m unittest discover -s scripts -p personal_crdo_indicators_test.py
      - name: Compare CRDO candidates on last 20 completed sessions
        run: python scripts/personal_crdo_indicators.py
