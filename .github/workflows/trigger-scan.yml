name: Check three-hour scan trigger
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: three-hour-scan-trigger
  cancel-in-progress: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trigger rules
        run: node --test scripts/scan-trigger.test.mjs
      - name: Trigger scan when three hours have elapsed
        run: node scripts/trigger-scan.mjs
        env:
          GH_TOKEN: ${{ github.token }}
